# Loaded explicitly by the integration test; development configuration is excluded.
spring.application.name=plantplan-validation
server.address=127.0.0.1
spring.datasource.url=jdbc:h2:mem:plantplan_validation;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

plantplan.cors.allowed-origins=http://localhost:5173
# Public test fixture, never a deployment signing key.
plantplan.jwt.secret=cGxhbnRwbGFuLXZhbGlkYXRpb24tb25seS1wdWJsaWMtdGVzdC1rZXktMDEyMzQ1Njc4OQ==
plantplan.jwt.expiration=3600

# No external weather service is needed for these tests.
plantplan.weather.base-url=http://127.0.0.1:1
plantplan.weather.forecast-days=7
